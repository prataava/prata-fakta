# PRATA FAKTA — Pipeline editorial AI (GitHub Actions)
#
# Secret yang dibutuhkan (repo Settings -> Secrets and variables -> Actions):
#   PF_SITE_URL   = URL deploy, mis. https://prata-fakta.vercel.app
#                   (TANPA trailing slash)
#   PF_AI_SECRET  = secret pemicu endpoint AI; nilainya HARUS sama dengan
#                   env PF_AI_SECRET di Vercel.
#
# Catatan: workflow ini TIDAK AKTIF sampai ada deploy + kedua secret di atas
# terisi. Bila secret belum terisi, job gagal dengan HTTP 503 yang jujur
# dari endpoint (bukan error workflow).
#
# Jadwal: pipeline editorial setiap 2 jam: memproses sampai 50 item dari
# antrean, dipecah jadi panggilan-panggilan kecil 10 item (satu panggilan
# 50 item terbukti timeout 504 di gateway — run #2, 17 Nov 2026).
# Artikel yang dihasilkan SELALU status='draft' — workflow ini TIDAK
# PERNAH menerbitkan langsung.
#
# Sejarah (Tahap 13C, F2/F4): file ini dulu bagian dari
# `.github/workflows/editorial.yml` yang menggabungkan 3 jadwal dalam
# satu workflow dengan gating string
# `github.event.schedule == '...'` (rapuh, F4) dan input dispatch
# `tugas=keduanya` yang TIDAK menjalankan terbitkan-terjadwal (F2).
# Kini tiap jadwal punya workflow sendiri — tanpa perbandingan
# string jadwal sama sekali. Untuk menjalankan pipeline +
# terbitkan-terjadwal bersamaan, dispatch workflow ini DAN
# `terbitkan-terjadwal.yml` (atau picu keduanya dari /admin/kendali).
#
# Concurrency (F3): satu run pipeline pada satu waktu
# (cancel-in-progress false — run yang sedang jalan tidak dibatalkan,
# run baru menunggu giliran Actions).
# Retry (F8, diubah Tahap E): TIDAK ADA curl --retry di sini.
# Retry hidup DI DALAM pipeline, per item (tiap item dibungkus
# try/catch; item gagal dicatat lalu dilewati, draf gagal -> status
# item tetap UNCONFIRMED untuk run berikutnya; rekonsiliasi di
# akhir run memperbaiki draf/tautan yatim). Memicu ulang endpoint
# berarti memproses ulang antrean — itulah "mengulang seluruh job"
# yang dilarang Tahap E. Bila POST ini gagal sementara, run cron
# 2 jam berikutnya yang mengambil alih; kegagalan sebagian sudah
# terlihat lewat assert di bawah + pf_ai_runs.
# Assert respons (F5): sukses palsu parsial ditolak — job gagal bila
# `ok != true` atau `gagal > 0`, bukan hanya bila HTTP non-2xx.
#
# Alerting: belum ada notifikasi (email/Slack/WhatsApp) — kegagalan
# terlihat di tab Actions (log run + badge workflow) dan di tabel
# pf_ai_runs / pf_scheduled_jobs (status_terakhir='gagal',
# error_terakhir). Lihat LAPORAN-FASE-8 §14.

name: Pipeline Editorial PRATA FAKTA

on:
  schedule:
    # Pipeline editorial setiap 2 jam (dinaikkan dari 6 jam pada
    # 16 Nov 2026 atas permintaan pemilik — draf cepat terisi).
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Jumlah item yang diproses pipeline (1-50)"
        required: false
        default: "50"
        type: string

concurrency:
  group: prata-fakta-editorial-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pemicu pipeline editorial
        run: |
          # Batas gateway: satu panggilan sinkron yang memproses 50 item
          # memakan waktu >~5 menit dan diputus 504 (terbukti run #2,
          # 17 Nov 2026). Karena itu target dipecah jadi panggilan-
          # panggilan kecil 10 item — ukuran yang terbukti selesai —
          # maksimal 5 panggilan per run. Antrean dikuras bertahap
          # tanpa satu panggilan pun melewati batas waktu gateway.
          TARGET="${{ inputs.limit }}"
          if [ -z "$TARGET" ]; then TARGET="50"; fi
          TOTAL_DIPROSES=0
          TOTAL_DRAF=0
          TOTAL_GAGAL=0
          PANGGILAN=0
          while [ "$PANGGILAN" -lt 5 ] && [ "$TOTAL_DIPROSES" -lt "$TARGET" ]; do
            PANGGILAN=$((PANGGILAN + 1))
            SISA=$((TARGET - TOTAL_DIPROSES))
            if [ "$SISA" -gt 10 ]; then SISA=10; fi
            RESP="$(mktemp)"
            curl --fail-with-body -sS -X POST \
              "${{ secrets.PF_SITE_URL }}/api/ai/jalankan" \
              -H "x-pf-ai-secret: ${{ secrets.PF_AI_SECRET }}" \
              -H "Content-Type: application/json" \
              -d "{\"dipicu_oleh\":\"github_actions\",\"limit\":$SISA}" \
              -o "$RESP"
            echo "Respons pipeline panggilan $PANGGILAN: $(cat "$RESP")"
            jq -e '.ok == true' "$RESP" >/dev/null \
              || { echo "ASSERT GAGAL: pipeline panggilan $PANGGILAN melaporkan ok != true"; exit 1; }
            DIPROSES="$(jq -r '.diproses // 0' "$RESP")"
            DRAF="$(jq -r '.draf // 0' "$RESP")"
            GAGAL="$(jq -r '.gagal // 0' "$RESP")"
            TOTAL_DIPROSES=$((TOTAL_DIPROSES + DIPROSES))
            TOTAL_DRAF=$((TOTAL_DRAF + DRAF))
            TOTAL_GAGAL=$((TOTAL_GAGAL + GAGAL))
            rm -f "$RESP"
            if [ "$DIPROSES" -eq 0 ]; then
              echo "Antrean kosong — berhenti sesudah $PANGGILAN panggilan."
              break
            fi
          done
          echo "Total: diproses=$TOTAL_DIPROSES draf=$TOTAL_DRAF gagal=$TOTAL_GAGAL (target=$TARGET, panggilan=$PANGGILAN)"
          if [ "$TOTAL_GAGAL" -gt 0 ]; then
            echo "ASSERT GAGAL: pipeline melaporkan gagal > 0"
            exit 1
          fi
