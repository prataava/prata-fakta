# PRATA FAKTA — Scheduler ingestion (GitHub Actions)
#
# Secret yang dibutuhkan (repo Settings -> Secrets and variables -> Actions):
#   PF_SITE_URL         = URL deploy, mis. https://prata-fakta.vercel.app
#                         (TANPA trailing slash)
#   PF_INGESTION_SECRET = secret pemicu endpoint ingestion; nilainya HARUS
#                         sama dengan env PF_INGESTION_SECRET di Vercel.
#
# Catatan: workflow ini TIDAK AKTIF sampai ada deploy + kedua secret di atas
# terisi. Bila secret belum terisi, job gagal dengan HTTP 503 yang jujur
# dari endpoint (bukan error workflow).
#
# Concurrency (Tahap 13C, F3): satu run ingestion pada satu waktu
# (cancel-in-progress false — run yang sedang jalan tidak dibatalkan,
# run baru menunggu giliran Actions).
# Lock server-side (Gelombang B1): TIMEOUT_LOCK_MENIT 15 menit —
# lebih lama dari timeout workflow (10 menit) tapi lebih cepat dari
# interval cron (30 menit), jadi lock basi tidak pernah memblokir
# run berikutnya.
# Retry (F8, diubah Tahap E): TIDAK ADA curl --retry di sini.
# Retry hidup DI DALAM engine, per sumber (lib/ingestion/retry.ts:
# maks 3 percobaan, backoff eksponensial, hormati Retry-After).
# Memicu ulang endpoint berarti mengambil ulang SEMUA feed —
# itulah "mengulang seluruh job" yang dilarang Tahap E. Bila POST
# ini gagal sementara (jaringan/5xx), run cron 30 menit berikutnya
# yang mengambil alih; kegagalan sebagian sudah terlihat lewat
# assert di bawah + status run 'sebagian'/'gagal' di
# pf_ingestion_runs (bukan sukses diam-diam).
# Assert respons (F5, diubah Fase 3): sukses palsu parsial ditolak —
# TAPI hanya untuk kegagalan kelas BERAT. Job gagal bila
# `ok != true` atau `total.gagal_berat > 0` (kelas invalid-feed /
# permanently-failed / galat engine). Kegagalan sementara
# (rate-limited / unavailable / dilewati / sebagian) = job SUCCESS
# dengan peringatan: kegagalan tetap tercatat di pf_ingestion_runs
# (status + kelas_gagal) dan di ringkasan run di bawah, hanya tidak
# menghentikan jadwal cron — GDELT 429 tidak boleh membuat 7 feed
# RSS yang sehat terlihat "gagal" setiap 30 menit.
# Transisi: bila endpoint masih kode lama (tanpa total.gagal_berat),
# pakai aturan lama (total.gagal == 0) agar assert tidak lolos
# diam-diam selama deploy bergulir.
#
# Alerting: belum ada notifikasi (email/Slack/WhatsApp) — kegagalan
# terlihat di tab Actions (log run + badge workflow) dan di tabel
# pf_ingestion_runs / pf_scheduled_jobs (status_terakhir='gagal',
# error_terakhir). Lihat LAPORAN-FASE-8 §14.

name: Ingestion PRATA FAKTA

on:
  schedule:
    # Setiap 30 menit.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      sumber_id:
        description: "ID sumber tertentu (kosong = semua sumber aktif)"
        required: false
        default: ""
        type: string

concurrency:
  group: prata-fakta-ingestion
  cancel-in-progress: false

jobs:
  ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pemicu ingestion
        run: |
          BODY='{"dipicu_oleh":"github_actions"}'
          if [ -n "${{ inputs.sumber_id }}" ]; then
            BODY=$(jq -n --arg s "${{ inputs.sumber_id }}" \
              '{dipicu_oleh:"github_actions", sumber_id:$s}')
          fi
          RESP="$(mktemp)"
          curl --fail-with-body -sS -X POST \
            "${{ secrets.PF_SITE_URL }}/api/ingestion/jalankan" \
            -H "x-pf-ingestion-secret: ${{ secrets.PF_INGESTION_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            -o "$RESP"
          echo "Respons ingestion: $(cat "$RESP")"
          # Ringkasan per sumber (kelas + jumlah) — kegagalan TIDAK
          # disembunyikan: kelas sementara pun tampil di log run.
          jq -r '.per_sumber[]? | "\(.sumber_nama): kelas=\(.kelas // "-") baru=\(.baru // 0) duplikat=\(.duplikat // 0) gagal=\(.gagal // 0)"' "$RESP"
          echo "Total: $(jq -c '.total' "$RESP")"
          jq -e '.ok == true' "$RESP" >/dev/null \
            || { echo "ASSERT GAGAL: ingestion melaporkan ok != true"; exit 1; }
          # Gagal berat: dari total.gagal_berat (kode baru); bila
          # tidak ada (kode lama), pakai aturan lama total.gagal.
          GAGAL_BERAT="$(jq -r '.total.gagal_berat // empty' "$RESP")"
          if [ -z "$GAGAL_BERAT" ]; then
            echo "PERINGATAN: respons tanpa total.gagal_berat (kode lama?) — pakai aturan lama total.gagal."
            GAGAL_BERAT="$(jq -r '.total.gagal // 0' "$RESP")"
          fi
          if [ "$GAGAL_BERAT" -gt 0 ]; then
            echo "ASSERT GAGAL: ingestion melaporkan gagal_berat=$GAGAL_BERAT (kelas berat: invalid-feed / permanently-failed / galat engine)"
            exit 1
          fi
          GAGAL="$(jq -r '.total.gagal // 0' "$RESP")"
          if [ "$GAGAL" -gt 0 ]; then
            echo "PERINGATAN: ingestion sukses dengan $GAGAL kegagalan sementara (lihat kelas per sumber di atas + pf_ingestion_runs)."
          fi
