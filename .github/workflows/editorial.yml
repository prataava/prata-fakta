# PRATA FAKTA — Scheduler editorial AI (GitHub Actions)
#
# Secret yang dibutuhkan (repo Settings -> Secrets and variables -> Actions):
#   PF_SITE_URL   = URL deploy, mis. https://prata-fakta.vercel.app
#                   (TANPA trailing slash)
#   PF_AI_SECRET  = secret pemicu endpoint AI; nilainya HARUS sama dengan
#                   env PF_AI_SECRET di Vercel.
#
# Catatan: workflow ini TIDAK AKTIF sampai ada deploy + kedua secret di atas
# terisi. Bila secret belum terisi, job gagal dengan HTTP 503 yang jujur
# dari endpoint (bukan error workflow).
#
# Jadwal:
#   - Pipeline editorial setiap 6 jam (00, 06, 12, 18 UTC = 07, 13, 19,
#     01 WIB): memproses 10 item UNCONFIRMED teratas dari antrean.
#   - Daily Brief setiap hari 22:00 UTC (= 05:00 WIB): menyusun brief
#     hari itu dari draf artikel terbaru + antrean.
# Artikel yang dihasilkan SELALU status='draft' — workflow ini TIDAK
# PERNAH menerbitkan. Penerbitan tetap butuh persetujuan editorial
# (Fase 5).

name: Editorial AI PRATA FAKTA

on:
  schedule:
    # Pipeline editorial setiap 6 jam.
    - cron: "0 0,6,12,18 * * *"
    # Daily Brief setiap hari 22:00 UTC (= 05:00 WIB).
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      tugas:
        description: "Tugas yang dijalankan (pipeline / brief / keduanya)"
        required: false
        default: "keduanya"
        type: choice
        options:
          - keduanya
          - pipeline
          - brief
      limit:
        description: "Jumlah item yang diproses pipeline (1-50)"
        required: false
        default: "10"
        type: string

jobs:
  pipeline:
    # Jalan pada jadwal 6-jaman ATAU bila dipicu manual untuk
    # pipeline/keduanya. (Jadwal 22:00 UTC hanya untuk brief.)
    if: >
      github.event.schedule == '0 0,6,12,18 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.tugas == 'keduanya' || inputs.tugas == 'pipeline'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pemicu pipeline editorial
        run: |
          LIMIT="${{ inputs.limit }}"
          if [ -z "$LIMIT" ]; then LIMIT="10"; fi
          curl --fail-with-body -sS -X POST \
            "${{ secrets.PF_SITE_URL }}/api/ai/jalankan" \
            -H "x-pf-ai-secret: ${{ secrets.PF_AI_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"dipicu_oleh\":\"github_actions\",\"limit\":$LIMIT}"

  brief:
    # Jalan pada jadwal 22:00 UTC ATAU bila dipicu manual untuk
    # brief/keduanya.
    if: >
      github.event.schedule == '0 22 * * *' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.tugas == 'keduanya' || inputs.tugas == 'brief'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pemicu Daily Brief
        run: |
          curl --fail-with-body -sS -X POST \
            "${{ secrets.PF_SITE_URL }}/api/ai/brief" \
            -H "x-pf-ai-secret: ${{ secrets.PF_AI_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"dipicu_oleh":"github_actions"}'
